appId: com.minecraft.botcontroller
productName: Frinedo
publish:
  provider: github
  owner: YASSER-27
  repo: Frinedo
directories:
  output: release
  buildResources: resources
files:
  - dist/**/*
  - src/public/**/*
  - src/store/**/*
  - package.json
extraResources:
  - from: data
    to: data
    filter:
      - "**/*"
win:
  target:
    - nsis
  icon: resources/icon.ico
nsis:
  installerSidebar: src/public/setup.png
mac:
  target:
    - dmg
  icon: resources/icon.png
linux:
  target:
    - AppImage
  icon: resources/icon.png